name: Pull vault checklist state before cloud task run

# NOTE (2026-10-06): this job is now a FALLBACK. GitHub's cron delay kept
# growing until it landed after the cloud run, so the cloud routine now mounts
# obsidian-tasks-sync as a second source and reads the previous day's note
# directly at run time (writing what it read to tasks/daily/_vault-state.md in
# its own commit). This job remains for (a) the carry-over repair step below,
# which compares that record against the real note when they differ, and
# (b) the delay log in logs/vault-sync.tsv.
#
# The cloud /task run (claude.ai Remote Trigger) has no filesystem access to the
# Obsidian Vault (it's a local iCloud folder), so it cannot see which checklist
# items the user has actually checked off there. This job copies the latest real
# checklist state from the obsidian-tasks-sync repo into tasks/daily/_vault-state.md,
# so the cloud run can read genuine completion state instead of re-guessing it
# from Chatwork/Slack/Gmail content each morning.
#
# Timing matters, and getting it wrong is silent. The cloud task fires ~08:15 JST.
# This job used to be scheduled at 07:50 JST on the assumption that "just before"
# was enough, but GitHub delays scheduled runs: every actual start between 08-31
# and 09-05 landed at 09:24-10:24 JST, i.e. AFTER the cloud run. That broke
# carry-over twice over:
#   1. the cloud run read a file last written the PREVIOUS morning, and
#   2. by the time this job ran, today's freshly generated note had already been
#      mirrored into obsidian-tasks-sync, so `sort -r | head -1` picked that
#      all-unchecked note and skipped straight past the day whose boxes the user
#      had actually ticked. The user's checkmarks were never observed at all.
# Hence both guards below: early crons with hours of slack for GitHub's delay,
# and an explicit skip of today's note so a late run still picks the right file.
#
# A single 03:00 JST cron was not enough either: GitHub's delay kept growing
# (starts drifted from ~05:20 to 08:29 JST by 10-06), and on 10-06 the only run
# landed 9 minutes AFTER the cloud run, which then read the note from two days
# earlier and dropped the previous day's handwritten tasks and checkmarks.
# So fire several times through the night, off the top of the hour (the most
# congested slot). Every run is idempotent -- it only commits when the picked
# note changed -- so extra runs are free, and later ones also pick up any boxes
# ticked after midnight. Do not schedule before 15:00 UTC (00:00 JST): the
# "today" skip below would then skip the wrong day and pick the day before.

on:
  schedule:
    - cron: "10 15 * * *"  # 00:10 JST
    - cron: "10 17 * * *"  # 02:10 JST
    - cron: "10 19 * * *"  # 04:10 JST
    - cron: "10 21 * * *"  # 06:10 JST -- latest slot; cloud run fires ~08:10 JST
  workflow_dispatch: {}

# Overlapping delayed runs must not race each other's push.
concurrency:
  group: pull-vault-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ai-company
        uses: actions/checkout@v4

      - name: Checkout obsidian-tasks-sync
        uses: actions/checkout@v4
        with:
          repository: koki-nakata/obsidian-tasks-sync
          token: ${{ secrets.SYNC_REPO_TOKEN }}
          path: obsidian-tasks-sync

      - name: Copy latest checklist state into ai-company
        run: |
          mkdir -p tasks/daily
          # Today in JST, not UTC: this job runs at 18:00 UTC, which is already
          # the next day in Tokyo, so `date -u` would name the wrong day and the
          # skip below would not skip anything.
          today=$(TZ=Asia/Tokyo date +%F)
          # Match only real dated notes (タスクリスト — YYYY-MM-DD.md). A loose
          # prefix match previously also matched the mirrored junk file
          # "タスクリスト — _vault-state.md" (created by a sync-to-obsidian.yml
          # bug, now fixed) — since "_" sorts after digits, `sort -r` picked
          # that frozen file as "latest" forever, silently freezing this file
          # and breaking carry-over of pending tasks for days. Do not loosen
          # this pattern without also checking sync-to-obsidian.yml's exclude.
          # Today's note is excluded because it is the cloud run's own output
          # from a few hours ago with nothing ticked yet; the state worth
          # carrying over is always the most recent note from a previous day.
          latest=$(ls obsidian-tasks-sync/todo 2>/dev/null \
            | grep -E '^タスクリスト — [0-9]{4}-[0-9]{2}-[0-9]{2}\.md$' \
            | grep -v -x -F "タスクリスト — ${today}.md" \
            | sort -r | head -1)
          if [ -z "$latest" ]; then
            echo "no vault notes found in obsidian-tasks-sync/todo (excluding today, ${today})"
            exit 0
          fi
          {
            echo "<!-- source: obsidian-tasks-sync/todo/${latest} -->"
            echo "<!-- synced: $(date -u +%Y-%m-%dT%H:%M:%SZ) -->"
            echo
            cat "obsidian-tasks-sync/todo/${latest}"
          } > tasks/daily/_vault-state.md

          # Log what was picked up. If checked=0 every single day, this job is
          # snapshotting notes before the user has ticked anything -- the exact
          # failure this workflow's header describes.
          checked=$(grep -c -E '^- \[[xX]\]' "obsidian-tasks-sync/todo/${latest}" || true)
          pending=$(grep -c -E '^- \[ \]' "obsidian-tasks-sync/todo/${latest}" || true)
          echo "picked: ${latest} (today=${today}) -- checked=${checked} pending=${pending}"
          {
            echo "### Vault state pulled"
            echo "- source: \`${latest}\`"
            echo "- today (JST): \`${today}\`"
            echo "- checked: **${checked}**, pending: **${pending}**"
          } >> "$GITHUB_STEP_SUMMARY"

      # If this run is late enough that the cloud run already produced today's
      # note, that note was built from stale state. Compare what the cloud run
      # actually read (the _vault-state.md on its own branch) with the correct
      # state just pulled, and patch today's note in obsidian-tasks-sync in place
      # (add dropped tasks, tick items already done). Patching in place, not
      # regenerating, keeps anything the user has ticked in today's note since.
      - name: Repair today's note if the cloud run read stale state
        id: repair
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          note="obsidian-tasks-sync/todo/タスクリスト — ${today}.md"
          result="not needed (cloud run has not produced today's note yet)"
          if [ -f "$note" ]; then
            # The cloud run's branch name has changed before without notice, so
            # find it by commit subject across all branches, not by name.
            git fetch -q --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'
            br=$(git for-each-ref --sort=-committerdate \
                   --format='%(refname:short)%09%(subject)' refs/remotes/origin \
                 | awk -F'\t' -v s="chore: daily task list ${today}" 'index($2, s) == 1 { print $1; exit }')
            if [ -z "$br" ]; then
              result="skipped (no cloud run branch found for ${today})"
            else
              git show "${br}:tasks/daily/_vault-state.md" > "$RUNNER_TEMP/seen.md" 2>/dev/null \
                || : > "$RUNNER_TEMP/seen.md"
              # A repair failure must not stop the vault-state sync below.
              out=$(python3 scripts/repair_carryover.py "$RUNNER_TEMP/seen.md" tasks/daily/_vault-state.md "$note" 2>&1) \
                || out="error: repair script failed: ${out}"
              echo "$out"
              result=$(echo "$out" | head -1)
              if [ "${result%%:*}" = "repaired" ]; then
                cd obsidian-tasks-sync
                git config user.name "ai-company-bot"
                git config user.email "actions@github.com"
                git add todo/
                git commit -q -m "repair: carry-over for ${today} (vault-state sync landed after the cloud run)"
                # The user's Obsidian Git may have pushed in the meantime.
                git pull -q --rebase && git push -q || result="${result} (push FAILED)"
              fi
            fi
          fi
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "### Carry-over repair: ${result}" >> "$GITHUB_STEP_SUMMARY"

      # Persist every run's actual start time against its scheduled slot, so
      # GitHub's cron delay is visible over time (logs/vault-sync.tsv).
      - name: Record sync timing
        env:
          SLOT: ${{ github.event.schedule }}
          REPAIR: ${{ steps.repair.outputs.result }}
        run: |
          log=logs/vault-sync.tsv
          mkdir -p logs
          [ -f "$log" ] || printf 'started_jst\tslot_jst\tdelay_min\tsource\tcarryover_repair\n' > "$log"
          now=$(date -u +%s)
          if [ -n "$SLOT" ]; then
            read -r m h _ <<< "$SLOT"
            sched=$(date -u -d "$(date -u +%F) ${h}:${m}" +%s)
            [ "$sched" -gt "$now" ] && sched=$((sched - 86400))
            slot=$(TZ=Asia/Tokyo date -d "@$sched" +%H:%M)
            delay=$(( (now - sched) / 60 ))
          else
            slot=manual; delay=-
          fi
          src=$(head -1 tasks/daily/_vault-state.md | sed -E 's/.*todo\/(.*) -->/\1/')
          printf '%s\t%s\t%s\t%s\t%s\n' "$(TZ=Asia/Tokyo date '+%F %H:%M')" "$slot" "$delay" "$src" "$REPAIR" >> "$log"
          tail -1 "$log"
          echo "- started $(TZ=Asia/Tokyo date +%H:%M) JST, slot ${slot}, delay **${delay} min**" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          git config user.name "ai-company-bot"
          git config user.email "actions@github.com"
          # Don't commit a _vault-state.md whose only change is the "synced:"
          # timestamp; the timing log already records that this run happened.
          f=tasks/daily/_vault-state.md
          if cmp -s <(git show "HEAD:$f" 2>/dev/null | grep -v '^<!-- synced: ') \
                    <(grep -v '^<!-- synced: ' "$f"); then
            git checkout -- "$f"
          fi
          git add "$f" logs/vault-sync.tsv
          git commit -q -m "chore: sync vault checklist state $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
